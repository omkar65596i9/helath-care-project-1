                        <option value="Sangli">Sangli</option>
                        <option value="Satara">Satara</option>

                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Select Hospital</label>
                    <select id="hospitalSelect" disabled required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                        <option value="">First Select Location</option>
                    </select>
                </div>

                <!-- Step 3: Select Doctor -->
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Select Doctor</label>
                    <select id="doctorSelect" disabled required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                        <option value="">First Select Hospital</option>
                    </select>

                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Date</label>

                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Time Slot</label>
                        <select id="bookingTime" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">

                </div>

                <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; text-align: center; border-radius: 10px;">Book Appointment</button>
            </form>

                "Sanjeevani Hospital": ["Dr. Radhakishan Pawar (General Surgeon)", "Dr. Amit Joshi (Orthopedic)"],

            },
            "Parbhani": {

                "Civil Hospital": ["Dr. K. M. More (Physician)", "Dr. R. S. Jadhav (Pediatrician)"],

            }
        };

        const locationSelect = document.getElementById("locationSelect");
        const hospitalSelect = document.getElementById("hospitalSelect");
        const doctorSelect = document.getElementById("doctorSelect");
        const appointmentForm = document.getElementById("appointmentForm");

        // Helper Function: Populate Hospitals based on Location
        function populateHospitals(loc) {
            hospitalSelect.innerHTML = '<option value="">Select Hospital</option>';
            doctorSelect.innerHTML = '<option value="">First Select Hospital</option>';
            doctorSelect.disabled = true;

            if (loc && dataHierarchy[loc]) {
                hospitalSelect.disabled = false;
                Object.keys(dataHierarchy[loc]).forEach(hosp => {
                    hospitalSelect.innerHTML += `<option value="${hosp}">${hosp}</option>`;
                });
            } else {
                hospitalSelect.disabled = true;
                hospitalSelect.innerHTML = '<option value="">First Select Location</option>';
            }
        }

        // Helper Function: Populate Doctors based on Hospital
        function populateDoctors(loc, hosp) {
            doctorSelect.innerHTML = '<option value="">Select Doctor</option>';
            if (loc && hosp && dataHierarchy[loc][hosp]) {
                doctorSelect.disabled = false;
                dataHierarchy[loc][hosp].forEach(doc => {
                    doctorSelect.innerHTML += `<option value="${doc}">${doc}</option>`;
                });
            } else {
                doctorSelect.disabled = true;
                doctorSelect.innerHTML = '<option value="">First Select Hospital</option>';
            }
        }

        // Step 1: Location Change Event
        locationSelect.addEventListener("change", function () {
            populateHospitals(this.value);
        });

        // Step 2: Hospital Change Event
        hospitalSelect.addEventListener("change", function () {
            populateDoctors(locationSelect.value, this.value);
        });

        // Step 3: Handle Booking Form Submission
        appointmentForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const bookingData = {
                fullName: document.getElementById("fullName").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                location: locationSelect.value,
                hospital: hospitalSelect.value,
                doctor: doctorSelect.value,
                date: document.getElementById("bookingDate").value,
                time: document.getElementById("bookingTime").value,
                status: "Upcoming"
            };

            // Get existing records or initialize new array
            let records = JSON.parse(localStorage.getItem("medicareRecords")) || [];
            records.push(bookingData);
            
            // Save to LocalStorage
            localStorage.setItem("medicareRecords", JSON.stringify(records));

            alert("Appointment Booked Successfully!");
            window.location.href = "records.html"; // Redirect to Records Page
        });

        // AUTO FILL FUNCTIONALITY FROM URL PARAMETERS
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const doctorParam = urlParams.get('doctor');
            const hospitalParam = urlParams.get('hospital');
            const locationParam = urlParams.get('location');

            if (locationParam) {
                // Find matching location (Case-insensitive)
                const matchedLoc = Object.keys(dataHierarchy).find(
                    key => key.toLowerCase() === locationParam.trim().toLowerCase()
                );

                if (matchedLoc) {
                    locationSelect.value = matchedLoc;
                    populateHospitals(matchedLoc);

                    if (hospitalParam) {
                        // Find matching hospital
                        const matchedHosp = Object.keys(dataHierarchy[matchedLoc]).find(
                            key => key.toLowerCase() === hospitalParam.trim().toLowerCase()
                        );

                        if (matchedHosp) {
                            hospitalSelect.value = matchedHosp;
                            populateDoctors(matchedLoc, matchedHosp);

                            if (doctorParam) {
                                // Find matching doctor
                                const docList = dataHierarchy[matchedLoc][matchedHosp];
                                const matchedDoc = docList.find(
                                    doc => doc.toLowerCase().includes(doctorParam.trim().toLowerCase())
                                );

                                if (matchedDoc) {
                                    doctorSelect.value = matchedDoc;
                                }
                            }
                        }
                    }
                }
            }
        });
