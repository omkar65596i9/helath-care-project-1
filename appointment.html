<body class="home-page">

    <section class="features-section" style="padding-top: 3rem;">
        <div style="max-width: 650px; margin: 0 auto; background: #ffffff; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
            
            <h2 style="text-align: center; color: #0d47a1; margin-bottom: 1.8rem; font-size: 2rem;">Book Appointment</h2>
            
            <form id="appointmentForm">
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter Full Name" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Email</label>
                    <input type="email" id="email" placeholder="Enter Email Address" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Phone</label>
                    <input type="tel" id="phone" placeholder="Enter Phone Number" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                </div>

                <!-- Step 1: Select Location -->
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Select Location</label>
                    <select id="locationSelect" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                        <option value="">Choose Location</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Chhatrapati Sambhajinagar (Aurangabad)">Chhatrapati Sambhajinagar (Aurangabad)</option>
                        <option value="Nagpur">Nagpur</option>
                        <option value="Nashik">Nashik</option>
                        <option value="Jalna">Jalna</option>
                        <option value="Kolhapur">Kolhapur</option>
                        <option value="Solapur">Solapur</option>
                        <option value="Amravati">Amravati</option>
                        <option value="Nanded">Nanded</option>
                        <option value="Jalgaon">Jalgaon</option>
                        <option value="Latur">Latur</option>
                        <option value="Sangli">Sangli</option>
                        <option value="Satara">Satara</option>
                        <option value="Ahmednagar">Ahmednagar</option>
                        <option value="Akola">Akola</option>
                        <option value="Chandrapur">Chandrapur</option>
                        <option value="Beed">Beed</option>
                        <option value="Parbhani">Parbhani</option>
                    </select>
                </div>

                <!-- Step 2: Select Hospital -->
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Select Hospital</label>
                    <select id="hospitalSelect" disabled required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                        <option value="">First Select Location</option>
                    </select>
                </div>

                <!-- Step 3: Select Doctor -->
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Select Doctor</label>
                    <select id="doctorSelect" disabled required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                        <option value="">First Select Hospital</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Date</label>
                        <input type="date" id="bookingDate" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display:block; margin-bottom: 0.4rem; font-weight: 600; color: #424242; font-size: 0.9rem;">Time Slot</label>
                        <select id="bookingTime" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbdefb; font-size: 0.95rem; outline: none; background: #f8fbff;">
                            <option value="">Select Time</option>
                            <option value="10:00 AM - 12:00 PM">10:00 AM - 12:00 PM</option>
                            <option value="02:00 PM - 04:00 PM">02:00 PM - 04:00 PM</option>
                            <option value="06:00 PM - 08:00 PM">06:00 PM - 08:00 PM</option>
                        </select>
                    </div>
                </div>

                <!-- PROFESSIONAL UPLOAD BOX WITH UPDATED TEXT -->
                <div style="margin-bottom: 1.5rem;">
                    <label style="display:block; margin-bottom: 0.5rem; font-weight: 600; color: #0d47a1; font-size: 0.95rem;">
                        Upload Medical Document <span style="font-weight: 400; color: #757575; font-size: 0.8rem;">(Optional)</span>
                    </label>
                    
                    <div id="dropZone" style="border: 2px dashed #bbdefb; background: #f8fbff; border-radius: 14px; padding: 1.5rem 1rem; text-align: center; position: relative; cursor: pointer; transition: all 0.3s ease;">
                        
                        <!-- Invisible Native Input over entire Box -->
                        <input type="file" id="medicalFile" accept=".pdf, image/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;">
                        
                        <!-- Default Upload UI -->
                        <div id="uploadUI">
                            <!-- Custom PDF Graphic Icon -->
                            <div style="width: 65px; height: 75px; background: #ffffff; border-radius: 8px; border: 2px solid #e0e0e0; margin: 0 auto 10px auto; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                <div style="position: absolute; top: 0; right: 0; width: 0; height: 0; border-top: 16px solid #bbdefb; border-left: 16px solid transparent;"></div>
                                <div style="background: #e53935; color: #ffffff; font-weight: 800; font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; letter-spacing: 0.5px; position: relative; z-index: 1;">PDF</div>
                                <i class="fas fa-arrow-up" style="position: absolute; bottom: 8px; color: #b0bec5; font-size: 0.9rem;"></i>
                            </div>
                            
                            <p style="margin: 0; font-size: 0.95rem; font-weight: 600; color: #0d47a1;">
                                <span style="text-decoration: underline;">Upload Medical Document</span>
                            </p>
                            <p style="margin: 4px 0 0 0; font-size: 0.78rem; color: #757575;">
                                Supported formats: PDF, JPG, PNG (Skip if no files)
                            </p>
                        </div>

                        <!-- Selected File Preview Container (Hidden by default) -->
                        <div id="filePreviewUI" style="display: none; align-items: center; justify-content: center; gap: 10px; color: #2e7d32; font-weight: 600; font-size: 0.95rem;">
                            <i class="fas fa-file-pdf" style="font-size: 1.8rem; color: #e53935;"></i>
                            <span id="selectedFileName">File Name</span>
                            <i class="fas fa-check-circle" style="color: #4caf50; font-size: 1.2rem; margin-left: 5px;"></i>
                        </div>

                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; text-align: center; border-radius: 10px;">Book Appointment</button>
            </form>

        </div>
    </section>

            },
            "Parbhani": {

                "Civil Hospital": ["Dr. K. M. More (Physician)", "Dr. R. S. Jadhav (Pediatrician)"],
                "Lotus Super Speciality Hospital": ["Dr. Vijay Patil (Cardiologist)", "Dr. Mahesh Shinde (Orthopedic)"]
            }
        };

        const locationSelect = document.getElementById("locationSelect");
        const hospitalSelect = document.getElementById("hospitalSelect");
        const doctorSelect = document.getElementById("doctorSelect");
        const appointmentForm = document.getElementById("appointmentForm");

        function populateHospitals(loc) {
            hospitalSelect.innerHTML = '<option value="">Select Hospital</option>';
            doctorSelect.innerHTML = '<option value="">First Select Hospital</option>';
            doctorSelect.disabled = true;

            if (loc && dataHierarchy[loc]) {
                hospitalSelect.disabled = false;
                Object.keys(dataHierarchy[loc]).forEach(hosp => {
                    hospitalSelect.innerHTML += `<option value="${hosp}">${hosp}</option>`;
                });
            } else {
                hospitalSelect.disabled = true;
                hospitalSelect.innerHTML = '<option value="">First Select Location</option>';
            }
        }

        function populateDoctors(loc, hosp) {
            doctorSelect.innerHTML = '<option value="">Select Doctor</option>';
            if (loc && hosp && dataHierarchy[loc][hosp]) {
                doctorSelect.disabled = false;
                dataHierarchy[loc][hosp].forEach(doc => {
                    doctorSelect.innerHTML += `<option value="${doc}">${doc}</option>`;
                });
            } else {
                doctorSelect.disabled = true;
                doctorSelect.innerHTML = '<option value="">First Select Hospital</option>';
            }
        }

        locationSelect.addEventListener("change", function () {
            populateHospitals(this.value);
        });

        hospitalSelect.addEventListener("change", function () {
            populateDoctors(locationSelect.value, this.value);
        });

        const fileInput = document.getElementById("medicalFile");
        const uploadUI = document.getElementById("uploadUI");
        const filePreviewUI = document.getElementById("filePreviewUI");
        const selectedFileName = document.getElementById("selectedFileName");
        const dropZone = document.getElementById("dropZone");

        fileInput.addEventListener("change", function () {
            if (this.files && this.files.length > 0) {
                uploadUI.style.display = "none";
                filePreviewUI.style.display = "flex";
                selectedFileName.textContent = this.files[0].name;
                dropZone.style.background = "#e8f5e9";
                dropZone.style.borderColor = "#66bb6a";
            } else {
                uploadUI.style.display = "block";
                filePreviewUI.style.display = "none";
                dropZone.style.background = "#f8fbff";
                dropZone.style.borderColor = "#bbdefb";
            }
        });

        // HANDLE BOOKING FORM SUBMISSION WITH BASE64 FILE CONVERSION
        appointmentForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const file = fileInput.files[0];

            function saveBookingData(fileData, fileName) {
                const bookingData = {
                    id: Date.now(),
                    fullName: document.getElementById("fullName").value,
                    email: document.getElementById("email").value,
                    phone: document.getElementById("phone").value,
                    location: locationSelect.value,
                    hospital: hospitalSelect.value,
                    doctor: doctorSelect.value,
                    date: document.getElementById("bookingDate").value,
                    time: document.getElementById("bookingTime").value,
                    attachedFileData: fileData, // Base64 Data String
                    attachedFile: fileName,
                    status: "Upcoming"
                };

                let records = JSON.parse(localStorage.getItem("medicareRecords")) || [];
                records.push(bookingData);
                localStorage.setItem("medicareRecords", JSON.stringify(records));

                alert("Appointment Booked Successfully!");
                window.location.href = "records.html";
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveBookingData(e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                saveBookingData(null, "No File Uploaded");
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const doctorParam = urlParams.get('doctor');
            const hospitalParam = urlParams.get('hospital');
            const locationParam = urlParams.get('location');

            if (locationParam) {
                const matchedLoc = Object.keys(dataHierarchy).find(
                    key => key.toLowerCase() === locationParam.trim().toLowerCase()
                );

                if (matchedLoc) {
                    locationSelect.value = matchedLoc;
                    populateHospitals(matchedLoc);

                    if (hospitalParam) {
                        const matchedHosp = Object.keys(dataHierarchy[matchedLoc]).find(
                            key => key.toLowerCase() === hospitalParam.trim().toLowerCase()
                        );

                        if (matchedHosp) {
                            hospitalSelect.value = matchedHosp;
                            populateDoctors(matchedLoc, matchedHosp);

                            if (doctorParam) {
                                const docList = dataHierarchy[matchedLoc][matchedHosp];
                                const matchedDoc = docList.find(
                                    doc => doc.toLowerCase().includes(doctorParam.trim().toLowerCase())
                                );

                                if (matchedDoc) {
                                    doctorSelect.value = matchedDoc;
                                }
                            }
                        }
                    }
                }
            }
        });
    </script>
