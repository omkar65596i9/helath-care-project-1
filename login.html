<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare Portal - Login</title>
    <!-- Google Font & FontAwesome Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #06b6d4;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Background Accents */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.25;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #0284c7;
            top: -50px;
            left: -50px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #0d9488;
            bottom: -50px;
            right: -50px;
        }

        /* Login Card Container */
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius);
            padding: 2.75rem 2.25rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            z-index: 2;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Logo & Branding */
        .logo-container {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.1) 0%, rgba(13, 148, 136, 0.1) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .heart-logo {
            font-size: 1.8rem;
            color: var(--primary);
            animation: smoothPulse 2s infinite ease-in-out;
        }

        @keyframes smoothPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }

        .brand-title {
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.025em;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            font-size: 0.9375rem;
            color: var(--text-main);
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            transition: all 0.2s ease-in-out;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Error Alert Box */
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: none;
            text-align: left;
        }

        /* Credentials Info */
        .credentials-info {
            margin-top: 1.75rem;
            padding: 0.875rem;
            background: #f1f5f9;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 0.78125rem;
            color: #475569;
            text-align: left;
            line-height: 1.6;
        }

        .credentials-info code {
            font-family: monospace;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <i class="fas fa-heart-pulse heart-logo"></i>
        </div>

        <h2 class="brand-title">MEDICARE</h2>
        <p class="brand-subtitle">Secure Access Portal</p>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@medicare.com" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span>Sign In</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
       <div class="credentials-info">
            <strong>Default Credentials:</strong><br>
            • User: <code>user@medicare.com</code> | <code>user123</code>
        </div>
       
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            try {
                // Correct Backend Route
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Storage Setup
                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userEmail', data.email);

                // Safe Relative Redirects
                if (data.role === 'admin') {
                    window.location.href = 'Admin page.html';
                } else if (data.role === 'user') {
                    window.location.href = 'index.html';
                }

            } catch (err) {
                errorMsg.innerText = err.message || 'Server connection error!';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
