<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Records - MediCare</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- CSS Path -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="home-page">

    <header>
        <div class="logo">
            <i class="fas fa-heartbeat"></i> MediCare
        </div>
        <nav>
            <a href="home.html">Home</a>
            <a href="doctor.html">Doctors</a>
            <a href="appointment.html">Appointment</a>
            <a href="records.html">Records</a>
            <a href="hospitals.html">Hospitals</a>
            <a href="index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="nav-icons">
           
            </a>
            <a href="ambulance.html">
                <i class="fas fa-car" title="Ambulance"></i>
            </a>
        </div>
    </header>

    <section class="features-section">
        <h2 class="section-title">Your Appointment Records</h2>

        <div id="recordsContainer" class="features-grid">
            <!-- Dynamic Records Inserted Here -->
        </div>
    </section>


    <!-- Records Rendering Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.getElementById("recordsContainer");
            const records = JSON.parse(localStorage.getItem("medicareRecords")) || [];

            if (records.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem; background: #fff; border-radius: 16px;">
                        <i class="fas fa-folder-open" style="font-size: 3rem; color: #9e9e9e; margin-bottom: 1rem;"></i>
                        <h3 style="color: #616161;">No Appointments Found</h3>
                        <p style="color: #757575;">Book an appointment to see your records here.</p>
                        <a href="file:///D:/helatcare-project/frontend/boking%20from.html" class="btn" style="margin-top: 1rem; display: inline-block;">Book Now</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            records.reverse().forEach((item, index) => {
                container.innerHTML += `
                    <div class="feature-card" style="text-align: left;">
                        <i class="fas fa-file-medical" style="display:block; text-align:center;"></i>
                        <h3 style="text-align:center; color: #0d47a1;">${item.doctor}</h3>
                        <p><b>Patient:</b> ${item.fullName}</p>
                        <p><b>Hospital:</b> ${item.hospital}</p>
                        <p><b>Location:</b> ${item.location}</p>
                        <p><b>Date & Time:</b> ${item.date} (${item.time})</p>
                        <p><b>Status:</b> <span style="color: #f39c12; font-weight: bold;">${item.status}</span></p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
